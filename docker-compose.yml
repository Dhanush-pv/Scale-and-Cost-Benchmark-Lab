services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: benchmark-lab-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: benchmark_lab
      CLICKHOUSE_USER: benchmark
      CLICKHOUSE_PASSWORD: benchmark_local_only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "benchmark", "--password", "benchmark_local_only", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_data:
