[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-cost-benchmark-lab"
version = "0.1.0"
description = "Reproducible analytical workload generation and benchmark foundation"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Dhanush"}]
dependencies = ["pyarrow>=16.0", "psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["duckdb>=1.0", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
benchmark-lab = "benchmark_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
